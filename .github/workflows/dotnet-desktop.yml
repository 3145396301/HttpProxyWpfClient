# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps


name: WPF Build & Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 框架依赖版：不含 .NET 10 运行时，体积小，但用户需自行安装 .NET 10 Desktop Runtime
      - name: Publish framework-dependent
        run: dotnet publish net8.0_ProxyWPF/net8.0_ProxyWPF.csproj -c ${{ matrix.configuration }} -f net10.0-windows --self-contained false -o publish/framework-dependent

      # 自包含版：把 win-x64 的 .NET 10 Desktop Runtime 一并打包，解压即用
      - name: Publish self-contained win-x64
        run: dotnet publish net8.0_ProxyWPF/net8.0_ProxyWPF.csproj -c ${{ matrix.configuration }} -f net10.0-windows -r win-x64 --self-contained true -o publish/self-contained-win-x64

      - name: Create ZIP packages
        shell: pwsh
        run: |
          $frameworkDependent = "ProxyWPF-net10.0-${{ matrix.configuration }}-FrameworkDependent.zip"
          $selfContained = "ProxyWPF-net10.0-${{ matrix.configuration }}-SelfContained-win-x64.zip"
          Compress-Archive -Path "publish/framework-dependent/*" -DestinationPath $frameworkDependent -Force
          Compress-Archive -Path "publish/self-contained-win-x64/*" -DestinationPath $selfContained -Force

      # 分开上传，避免 GitHub Actions 页面只显示一个混合 Artifact。
      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyWPF-net10.0-${{ matrix.configuration }}-FrameworkDependent
          path: ProxyWPF-net10.0-${{ matrix.configuration }}-FrameworkDependent.zip
          if-no-files-found: error

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyWPF-net10.0-${{ matrix.configuration }}-SelfContained-win-x64
          path: ProxyWPF-net10.0-${{ matrix.configuration }}-SelfContained-win-x64.zip
          if-no-files-found: error

      # 推送 v* 标签时自动创建 GitHub Release，同时附上两个 zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ProxyWPF-net10.0-${{ matrix.configuration }}-FrameworkDependent.zip
            ProxyWPF-net10.0-${{ matrix.configuration }}-SelfContained-win-x64.zip
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
